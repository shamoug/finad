# Builds Finad for Android (android/) whenever it changes, signs it with the key in this repository's secrets
# (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD), checks the signature, and publishes it on the website as
# docs/downloads/Finad-Android.apk. The same key signs every build, so a new version installs over the old one;
# docs/downloads/android.json tells the installed apps that it is there, and they update themselves (Updater.java).
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    name: Build, sign and publish
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build the signed app
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::The ANDROID_KEYSTORE_B64 secret is missing"; exit 1; }
          export VERSION_NAME="1.0.$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/finad.p12"
          export KEYSTORE="$RUNNER_TEMP/finad.p12" KEY_ALIAS=finad KEY_PASSWORD="$KEYSTORE_PASSWORD"
          gradle -p android assembleRelease --no-daemon --stacktrace
          rm -f "$RUNNER_TEMP/finad.p12"

      - name: Check it
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label|launchable-activity)"
          ls -l "$APK"

      - name: Publish on the website
        run: |
          mkdir -p docs/downloads
          cp android/app/build/outputs/apk/release/app-release.apk docs/downloads/Finad-Android.apk
          SHA=$(sha256sum docs/downloads/Finad-Android.apk | cut -d' ' -f1)
          printf '{"versionCode": %s, "versionName": "%s", "url": "https://shamoug.github.io/finad/downloads/Finad-Android.apk", "sha256": "%s", "date": "%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$SHA" "$(date -u +%F)" > docs/downloads/android.json
          cat docs/downloads/android.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/downloads/Finad-Android.apk docs/downloads/android.json
          git commit -m "Android app $VERSION_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
